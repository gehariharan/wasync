name: Verify and publish signed release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Draft version containing signed and notarized macOS assets (without v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    # GitHub hides draft releases from tokens without push access, even when
    # downloading only. This job does not modify the draft.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: bash scripts/verify-signed-release.sh "$PACKAGE_VERSION" "$ARCHITECTURE"

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    # Serialize writes to the shared Homebrew tap across releases.
    concurrency:
      group: homebrew-tap-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate checksums and cask, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$PACKAGE_VERSION" --dir dist/release
          cd dist/release
          sha256sum --check checksums.txt
          cd ../..
          extra=()
          if [[ "$(gh repo view --json isPrivate --jq .isPrivate)" == true ]]; then extra+=(--private); fi
          python3 scripts/homebrew-cask.py "$PACKAGE_VERSION" dist/release dist/expected.rb "${extra[@]}"
          cmp dist/expected.rb dist/release/wasync.rb
          gh api "repos/$GITHUB_REPOSITORY/tarball/v$PACKAGE_VERSION" > dist/source.tar.gz
          source_sum="$(sha256sum dist/source.tar.gz | cut -d' ' -f1)"
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$PACKAGE_VERSION" --jq .sha)"
          python3 scripts/homebrew-formulas.py "$PACKAGE_VERSION" "$source_sum" dist/expected-formulas --commit "${tag_commit:0:12}"
          cmp dist/expected-formulas/wasync-formula.rb dist/release/wasync-formula.rb
          cmp dist/expected-formulas/whatsapp-axi.rb dist/release/whatsapp-axi.rb
          cat > dist/release-notes.md <<'NOTES'
          Prebuilt preview packages. No Go compiler is required.

          macOS 15+: Apple Silicon and Intel executables are Developer ID signed and notarized. The matching .pkg installers are signed, notarized, and carry stapled tickets. Each installer lists "AXI for agents" (whatsapp-axi) as an optional part that is off unless you tick it.
          Windows 10/11 x64: download the windows_amd64-setup.exe for a per-user installation (AXI for agents is an unticked option), or extract the portable ZIP, which includes whatsapp-axi.exe. Windows previews are currently unsigned; Microsoft Artifact Signing integration is pending.
          Linux: extract the matching archive and run ./install.sh (glibc 2.35+). It asks before installing whatsapp-axi (AXI for agents); the default is no.
          Homebrew: follow the platform-specific installation and dependency-trust instructions in https://github.com/gehariharan/wasync#homebrew-installation. Linux installs both tools through the AXI formula; macOS uses the signed core cask alongside the AXI formula. Intel and Apple Silicon downloads select the native architecture automatically.
          Run wasync for the TUI, or wasync query --help for the agent query interface.
          Verify downloads against checksums.txt. Installation preserves per-user archives and pairing credentials.
          NOTES
          gh release edit "v$PACKAGE_VERSION" --draft=false --prerelease --notes-file dist/release-notes.md
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          bash scripts/publish-tap.sh dist/release

  homebrew-e2e:
    needs: publish
    uses: ./.github/workflows/homebrew-e2e.yml
    with:
      version: ${{ inputs.version }}
      allow_unsigned_preview: false
    secrets: inherit
