name: Deploy website

# Publishes website/ (gehariharan.com/wasync) with the project's pinned cf CLI.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts edit, and
# Workers Routes edit plus Zone read on gehariharan.com) and CLOUDFLARE_ACCOUNT_ID.
# Without them the run stops early with a notice instead of failing.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "internal/api/webassets/tokens.css"
      - "internal/api/webassets/components.css"
      - "internal/api/webassets/inter.woff2"
      - "internal/api/webassets/inter-license.txt"
      - "internal/api/webassets/icon.svg"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling an upload.
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check for the Cloudflare credentials
        id: credentials
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website not deployed::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish the website (see website/README.md). Nothing was deployed."
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - if: steps.credentials.outputs.ready == 'true'
        run: npm ci
      - name: Test the Worker and the platform detection
        if: steps.credentials.outputs.ready == 'true'
        run: npm test
      - name: Deploy
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MESSAGE: ${{ github.sha }}
        run: npm run deploy -- --message "$DEPLOY_MESSAGE"
      - name: Check the published pages
        if: steps.credentials.outputs.ready == 'true'
        run: |
          for path in /wasync/ /wasync/installoptions/; do
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "https://gehariharan.com$path"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' https://gehariharan.com/wasync/releases.json)
          case "$code" in
            200|404) echo "releases.json answered $code" ;;
            *) echo "::error::releases.json answered $code"; exit 1 ;;
          esac
