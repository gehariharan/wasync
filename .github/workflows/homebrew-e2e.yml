name: Homebrew installation E2E

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/homebrew-e2e.yml"
      - "Formula/**"
      - "Casks/**"
      - "lib/**"
      - "scripts/homebrew-*.py"
      - "scripts/smoke-installed.py"
      - "axi/scripts/homebrew-formula.py"
      - "go.mod"
      - "go.sum"
      - "axi/go.mod"
      - "axi/go.sum"
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      allow_unsigned_preview:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Existing published release version (without v)"
        required: true
        default: "0.1.0-preview.3"
        type: string
      allow_unsigned_preview:
        description: "CI-only quarantine exception for this unsigned preview (not a signing test)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAP_URL: ${{ github.event_name == 'pull_request' && format('file://{0}', github.workspace) || format('https://github.com/{0}.git', github.repository) }}

jobs:
  linux-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
      - name: Install both tools from the monorepo tap on Linux
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_ASK: '1'
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          brew tap --custom-remote gehariharan/tap "$TAP_URL"
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula gehariharan/tap/wasync
            brew trust --formula gehariharan/tap/whatsapp-axi
          fi
          brew install gehariharan/tap/whatsapp-axi
          actual_version="$(whatsapp-axi --version)"
          if [[ -n "$PACKAGE_VERSION" ]]; then test "$actual_version" = "$PACKAGE_VERSION"; fi
          wasync version | grep -F "wasync $actual_version "
          brew test gehariharan/tap/wasync
          brew test gehariharan/tap/whatsapp-axi
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install prebuilt release from the tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_ASK: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          PACKAGE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          brew tap --custom-remote gehariharan/tap "$TAP_URL"
          if brew help trust >/dev/null 2>&1; then
            brew trust --cask gehariharan/tap/wasync
            brew trust --formula gehariharan/tap/whatsapp-axi
          fi
          brew install --cask gehariharan/tap/wasync
          brew install gehariharan/tap/whatsapp-axi
          actual_version="$(brew info --json=v2 --cask gehariharan/tap/wasync | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          if [[ -n "$PACKAGE_VERSION" ]]; then test "$actual_version" = "$PACKAGE_VERSION"; fi
          test "$(whatsapp-axi --version)" = "$actual_version"
          printf 'PACKAGE_VERSION=%s\n' "$actual_version" >> "$GITHUB_ENV"
      - name: Explicit CI-only exception for unsigned preview
        if: inputs.allow_unsigned_preview
        run: bash scripts/test-unsigned-preview.sh
      - name: Exercise installed binary, concurrent queries and offline TUI
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          # The tap's latest release may predate the first-run access screen; remove
          # this once a release containing it is published.
          WASYNC_SMOKE_ALLOW_MISSING_FIRST_RUN: "1"
        run: python3 scripts/smoke-installed.py "$(brew --prefix)/bin/wasync" "$PACKAGE_VERSION" "$EXPECTED_ARCHITECTURE"
