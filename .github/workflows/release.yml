name: Build prebuilt installers

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0-preview.1); creates a draft prerelease"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "Invalid version" >&2
            exit 1
          fi
          # Create the immutable release tag while this commit is still HEAD.
          # A later release upload then needs only the normal contents permission.
          for tag in "v$version" "axi/v$version"; do
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "Release tag already points to a different commit" >&2
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          done
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin_arm64
          - runner: macos-15-intel
            platform: darwin_amd64
          - runner: ubuntu-22.04
            platform: linux_amd64
          - runner: ubuntu-22.04-arm
            platform: linux_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test storage, filtering, and integration
        run: go test -tags sqlite_fts5 ./...
      - name: Build native release packages
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: bash scripts/package.sh "$PACKAGE_VERSION"
      - name: Check the installers always install AXI for agents, and the Mac app's disk image, at the release version
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            bash scripts/test-macos-pkg.sh "dist/$PACKAGE_VERSION/$PLATFORM/wasync_${PACKAGE_VERSION}_${PLATFORM}.pkg" "$PACKAGE_VERSION" "${PLATFORM#darwin_}"
            bash scripts/test-macos-dmg.sh "dist/$PACKAGE_VERSION/$PLATFORM/wasync_${PACKAGE_VERSION}_${PLATFORM}.dmg" "$PACKAGE_VERSION" "${PLATFORM#darwin_}"
          else
            bash scripts/test-install-linux.sh "dist/$PACKAGE_VERSION/$PLATFORM/wasync_${PACKAGE_VERSION}_${PLATFORM}.tar.gz" "$PACKAGE_VERSION"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/${{ needs.version.outputs.value }}/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [version, axi]
    runs-on: windows-2022
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare native Windows packaging tools
        shell: pwsh
        run: |
          & C:/msys64/usr/bin/bash.exe -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) { throw 'C compiler installation failed' }
          'C:/msys64/ucrt64/bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'CC=C:/msys64/ucrt64/bin/gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Append
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: axi-dist
          path: ${{ runner.temp }}\axi-dist
      - name: Build Windows executables for signing
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          foreach ($name in 'AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','ARTIFACT_SIGNING_ENDPOINT','ARTIFACT_SIGNING_ACCOUNT','ARTIFACT_SIGNING_PROFILE') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required windows-signing environment variable: $name"
            }
          }
          $signRoot = Join-Path $env:RUNNER_TEMP 'wasync-sign'
          if (Test-Path $signRoot) { Remove-Item -Recurse -Force $signRoot }
          New-Item -ItemType Directory -Force $signRoot | Out-Null
          ./scripts/package-windows.ps1 -Version $env:PACKAGE_VERSION -BuildOnly -StageDir (Join-Path $signRoot 'wasync')
          foreach ($arch in 'amd64', 'arm64') {
            $axiZip = Join-Path $env:RUNNER_TEMP "axi-dist\wasync-axi_$($env:PACKAGE_VERSION)_windows_$arch.zip"
            if (-not (Test-Path $axiZip)) { throw "Missing standalone AXI Windows archive: $axiZip" }
            $dest = Join-Path $signRoot "axi-$arch"
            Expand-Archive -LiteralPath $axiZip -DestinationPath $dest
            # Remove the unsigned alias copy; it will be copied from the signed wasync-axi.exe before repacking.
            Remove-Item -LiteralPath (Join-Path $dest 'whatsapp-axi.exe') -Force
          }
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executables with Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}\wasync-sign
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Package signed Windows ZIPs and Setup installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          $signRoot = Join-Path $env:RUNNER_TEMP 'wasync-sign'
          ./scripts/package-windows.ps1 -Version $env:PACKAGE_VERSION -PackageOnly -StageDir (Join-Path $signRoot 'wasync')
          $out = Join-Path (Get-Location) "dist/$($env:PACKAGE_VERSION)/windows_amd64"
          foreach ($arch in 'amd64', 'arm64') {
            $axiStage = Join-Path $signRoot "axi-$arch"
            Copy-Item -Force (Join-Path $axiStage 'wasync-axi.exe') (Join-Path $axiStage 'whatsapp-axi.exe')
            Compress-Archive -Path "$axiStage/*" -DestinationPath (Join-Path $out "wasync-axi_$($env:PACKAGE_VERSION)_windows_$arch.zip") -Force
          }
          Remove-Item -Recurse -Force $signRoot
      - name: Sign Windows Setup installer with Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\${{ needs.version.outputs.value }}\windows_amd64\wasync_${{ needs.version.outputs.value }}_windows_amd64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Update Windows package checksums after signing
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          $out = Join-Path (Get-Location) "dist/$($env:PACKAGE_VERSION)/windows_amd64"
          foreach ($name in "wasync_$($env:PACKAGE_VERSION)_windows_amd64.zip", "wasync_$($env:PACKAGE_VERSION)_windows_amd64-setup.exe") {
            $path = Join-Path $out $name
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content -Encoding ascii "$path.sha256"
          }
      - name: Verify Authenticode signatures on all shipped Windows executables
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: ./scripts/verify-windows-signatures.ps1 -Version $env:PACKAGE_VERSION
      - name: Check Setup installs the wasync app and always installs AXI for agents, and the ZIP carries them
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: ./scripts/test-windows-installer.ps1 -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows_amd64
          path: dist/${{ needs.version.outputs.value }}/windows_amd64/*
          if-no-files-found: error
          retention-days: 7

  axi:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: axi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify coordinated release tags
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          for tag in "v$PACKAGE_VERSION" "axi/v$PACKAGE_VERSION"; do
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          done
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: axi/go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash scripts/package.sh "${{ needs.version.outputs.value }}"
      - run: bash scripts/check-dist.sh "${{ needs.version.outputs.value }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axi-dist
          path: axi/dist/${{ needs.version.outputs.value }}/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-axi
          path: axi/dist/${{ needs.version.outputs.value }}/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  axi-smoke:
    needs: [version, axi]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux_amd64
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
          - runner: macos-15
            platform: darwin_arm64
          - runner: macos-15-intel
            platform: darwin_amd64
          - runner: windows-2022
            platform: windows_amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: axi-dist
          path: dist
      - name: Verify and run native AXI archive
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cd dist
          base="wasync-axi_${VERSION}_${PLATFORM}"
          mkdir x
          if [[ "$PLATFORM" == windows_* ]]; then
            grep " $base.zip\$" SHA256SUMS | sha256sum -c -
            unzip -q "$base.zip" -d x
            got="$(./x/wasync-axi.exe --version | tr -d '\r')"
          else
            grep " $base.tar.gz\$" SHA256SUMS | shasum -a 256 -c -
            tar -xzf "$base.tar.gz" -C x
            got="$(./x/wasync-axi --version)"
          fi
          test "$got" = "$VERSION"

  release:
    needs: [version, build, windows, axi-smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Generate Homebrew cask and checksums
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "$PRIVATE_REPOSITORY" == "true" ]]; then extra+=(--private); fi
          python3 scripts/homebrew-cask.py "$PACKAGE_VERSION" dist/release dist/release/wasync.rb "${extra[@]}"
          gh api "repos/$GITHUB_REPOSITORY/tarball/v$PACKAGE_VERSION" > dist/source.tar.gz
          source_sum="$(sha256sum dist/source.tar.gz | cut -d' ' -f1)"
          python3 scripts/homebrew-formulas.py "$PACKAGE_VERSION" "$source_sum" dist/release --commit "${GITHUB_SHA:0:12}"
          cd dist/release
          sha256sum ./*.tar.gz ./*.pkg ./*.dmg ./*.zip ./*.exe > checksums.txt
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
        shell: bash
        run: |
          tag="v$PACKAGE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release for $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          cat > dist/release/RELEASE_NOTES.md <<'NOTES'
          Prebuilt preview packages. No Go compiler is required on the user's computer.

          - macOS 15+: the wasync app is the matching darwin_arm64 (Apple Silicon) or darwin_amd64 (Intel) .dmg: open it and drag wasync to Applications. The .pkg installs the wasync command instead; it always installs "AXI for agents" (wasync-axi) with wasync and changes no agent settings.
          - Linux: download the matching linux archive, extract it and run `./install.sh`. It installs wasync and wasync-axi (AXI for agents) without asking and changes no agent settings unless you pass `--axi-skill` or `--axi-hooks`; `--without-axi` is no longer accepted. Builds target glibc 2.35 or newer.
          - Windows: Setup installs the wasync app (Start menu) and always installs AXI for agents (wasync-axi.exe), and changes no agent settings; the portable ZIP includes wasync-desktop.exe and wasync-axi.exe. Windows executables and Setup are Authenticode signed with Microsoft Artifact Signing.
          - Agents are connected later, from wasync's Connect an agent step.
          - `wasync query --help` documents the agent query interface.
          - Verify downloads against checksums.txt.

          Unpublished build-stage artifacts. Mac packages must pass the signing, notarization, and signed verification stages before publication.
          The generated wasync.rb is a binary-only Homebrew cask. Private releases use GitHub CLI authentication.
          Installation preserves existing per-user archives and pairing credentials.
          NOTES
          gh release create "$tag" --draft --prerelease --verify-tag \
            --title "wasync $PACKAGE_VERSION" --notes-file dist/release/RELEASE_NOTES.md \
            dist/release/*.tar.gz dist/release/*.pkg dist/release/*.dmg dist/release/*.zip dist/release/*.exe dist/release/checksums.txt dist/release/*.rb
