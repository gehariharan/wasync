name: Validate changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every native release target, so release.yml finds no new failures.
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -tags sqlite_fts5 ./...
      - run: go vet -tags sqlite_fts5 ./...
      - name: Exercise the real wasync and AXI pair with synthetic data
        run: |
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/wasync" ./cmd/wasync
          (cd axi && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/whatsapp-axi" ./cmd/whatsapp-axi)
          python3 scripts/smoke-pair.py "$RUNNER_TEMP/wasync" "$RUNNER_TEMP/whatsapp-axi"
      - name: Exercise the offline terminal UI in a real terminal, as the release check does
        run: python3 scripts/smoke-installed.py "$RUNNER_TEMP/wasync" dev "$(go env GOARCH)"
      - name: Build the release archive as release.yml does (unsigned)
        if: runner.os == 'Linux'
        run: |
          scripts/package.sh 0.0.0-ci.1
          tar -tzf dist/0.0.0-ci.1/linux_*/wasync_0.0.0-ci.1_linux_*.tar.gz | grep -qx wasync
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare Windows compiler and installer tools
        shell: pwsh
        run: |
          & C:/msys64/usr/bin/bash.exe -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) { throw 'C compiler installation failed' }
          'C:/msys64/ucrt64/bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'CC=C:/msys64/ucrt64/bin/gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Append
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler installation failed' }
          }
      - name: Validate Windows ACLs, device locking, SQLite WAL and full-text search
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: '-static'
        run: |
          go test -tags sqlite_fts5 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows platform checks failed' }
      - name: Build review installer and portable ZIP
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version 0.1.0-preview.pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-review-installer
          path: dist/0.1.0-preview.pr/windows_amd64/*
          if-no-files-found: error
  msix:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare compiler
        shell: pwsh
        run: |
          & C:/msys64/usr/bin/bash.exe -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) { throw 'Compiler installation failed' }
          'C:/msys64/ucrt64/bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'CC=C:/msys64/ucrt64/bin/gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Validate installed MSIX, alias, upgrade and retained data
        shell: pwsh
        run: ./scripts/test-msix.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msix-test-packages-not-for-store
          path: dist/store/*/*
          if-no-files-found: error
  tap-publish-script:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Homebrew tap publisher against a local tap
        run: bash scripts/test-publish-tap.sh
